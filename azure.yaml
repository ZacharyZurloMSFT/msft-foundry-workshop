# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: msft-foundry-workshop
metadata:
  template: msft-foundry-workshop
infra:
  provider: bicep
  path: ./infra
  parameters:
    dev:
      path: ./infra/parameters/dev.bicepparam
    prod:
      path: ./infra/parameters/prod.bicepparam
services:
  backend:
    project: ./src/backend
    language: py
    host: containerapp
  frontend:
    project: ./src/frontend
    language: js
    host: containerapp
