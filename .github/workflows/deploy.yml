name: Deploy Infrastructure & Application

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'src/**'
      - '.github/workflows/deploy.yml'

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_PRINCIPAL_ID: ${{ vars.AZURE_PRINCIPAL_ID }}
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME || 'dev' }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'centralus' }}

jobs:
  deploy:
    name: Provision & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Provision Infrastructure
        run: |
          set -e
          RG="rg-${AZURE_ENV_NAME}"

          # Auth
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider github \
            --tenant-id "$AZURE_TENANT_ID"

          # Create environment (no-op if it already exists), then explicitly select it
          azd env new "$AZURE_ENV_NAME" --location "$AZURE_LOCATION" --subscription "$AZURE_SUBSCRIPTION_ID" --no-prompt || true
          azd env select "$AZURE_ENV_NAME"
          azd env config set infra.parameters.principalId "$AZURE_PRINCIPAL_ID"

          # Provision infrastructure.
          # RoleAssignmentExists is non-fatal — Bicep uses deterministic GUIDs so
          # if the same assignment already exists it is already correct.
          # "Service update operations are not allowed at this time" is a transient
          # Azure-side restriction on private-endpoint-only AI Search; also non-fatal.
          echo "🏗️ Provisioning infrastructure..."
          if ! azd provision --no-prompt; then
            echo "⚠️  Provision step reported errors. Checking if search service is available..."
            SEARCH_UP=$(az search service show \
              --name "search-${AZURE_ENV_NAME}" \
              --resource-group "$RG" \
              --query "name" -o tsv 2>/dev/null || echo "")
            if [ -z "$SEARCH_UP" ]; then
              echo "❌ Search service does not exist — provision failed critically"
              exit 1
            fi
            echo "✅ Search service '${SEARCH_UP}' is up — continuing despite update error"

            # Recover the ACR endpoint from Azure so azd deploy can push images.
            # When provision partially fails, azd doesn't write environment outputs,
            # but the ACR already exists — look it up and inject it explicitly.
            ACR_SERVER=$(az acr list \
              --resource-group "$RG" \
              --query "[0].loginServer" -o tsv 2>/dev/null || echo "")
            if [ -n "$ACR_SERVER" ]; then
              azd env set AZURE_CONTAINER_REGISTRY_ENDPOINT "$ACR_SERVER"
              echo "✅ Recovered AZURE_CONTAINER_REGISTRY_ENDPOINT=$ACR_SERVER"
            fi
          fi

      - name: Pre-warm Docker layer cache (backend)
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          push: false
          load: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Pre-warm Docker layer cache (frontend)
        uses: docker/build-push-action@v6
        with:
          context: src/frontend
          push: false
          load: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy Application
        run: |
          set -e
          echo "🚀 Deploying application..."
          azd deploy --no-prompt

      - name: Setup Foundry Agent
        run: |
          set -e
          RG="rg-${AZURE_ENV_NAME}"
          BACKEND_APP="ca-backend-${AZURE_ENV_NAME}"

          BACKEND_FQDN=$(az containerapp show \
            --name "$BACKEND_APP" \
            --resource-group "$RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          BACKEND_URL="https://${BACKEND_FQDN}"

          echo "⏳ Waiting for backend to be healthy at $BACKEND_URL ..."
          for i in $(seq 1 24); do
            if curl -sf "${BACKEND_URL}/health" > /dev/null 2>&1; then
              echo "✅ Backend is healthy"
              break
            fi
            echo "  Attempt $i/24 — not ready yet, waiting 15s..."
            sleep 15
          done

          # The backend creates the agent on startup using its managed identity
          # (Azure AI Developer role, assigned via Bicep — no SP credential issues).
          # Read the agent ID back from the health endpoint and persist it as an
          # env var on the container app so it survives restarts.
          AGENT_ID=$(curl -sf "${BACKEND_URL}/health" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('agent_id') or '')" \
            2>/dev/null || echo "")

          if [ -n "$AGENT_ID" ]; then
            echo "✅ Agent created by backend: $AGENT_ID"
            az containerapp update \
              --name "$BACKEND_APP" \
              --resource-group "$RG" \
              --set-env-vars "AGENT_ID=$AGENT_ID"
            echo "✅ AGENT_ID set on container app"
          else
            echo "⚠️  Agent not yet ready — backend will create it on first chat request"
          fi

      - name: Print deployment URLs
        run: |
          RG="rg-${AZURE_ENV_NAME}"
          FRONTEND_FQDN=$(az containerapp show --name "ca-frontend-${AZURE_ENV_NAME}" --resource-group "$RG" --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "unknown")
          BACKEND_FQDN=$(az containerapp show --name "ca-backend-${AZURE_ENV_NAME}" --resource-group "$RG" --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "unknown")
          echo ""
          echo "========================================="
          echo "  🌐 Frontend: https://${FRONTEND_FQDN}"
          echo "  📡 Backend:  https://${BACKEND_FQDN}"
          echo "========================================="
