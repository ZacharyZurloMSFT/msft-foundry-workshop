name: Deploy Infrastructure & Application

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'src/**'
      - '.github/workflows/deploy.yml'

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_PRINCIPAL_ID: ${{ vars.AZURE_PRINCIPAL_ID }}
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME || 'dev' }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'centralus' }}

jobs:
  deploy:
    name: Provision & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Provision & Deploy
        run: |
          set -e
          RG="rg-${AZURE_ENV_NAME}"

          # Auth
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider github \
            --tenant-id "$AZURE_TENANT_ID"

          # Create environment (no-op if it already exists), then explicitly select it
          azd env new "$AZURE_ENV_NAME" --location "$AZURE_LOCATION" --subscription "$AZURE_SUBSCRIPTION_ID" --no-prompt || true
          azd env select "$AZURE_ENV_NAME"
          azd env config set infra.parameters.principalId "$AZURE_PRINCIPAL_ID"

          # Provision infrastructure
          # Note: re-running provision on an existing private-endpoint-only AI Search
          # service can return "Service update operations are not allowed at this time".
          # This is a transient Azure-side restriction; we treat it as non-fatal and
          # verify the service is actually up before continuing.
          echo "🏗️ Provisioning infrastructure..."
          if ! azd provision --no-prompt; then
            echo "⚠️  Provision step reported errors. Checking if search service is available..."
            SEARCH_UP=$(az search service show \
              --name "search-${AZURE_ENV_NAME}" \
              --resource-group "$RG" \
              --query "name" -o tsv 2>/dev/null || echo "")
            if [ -z "$SEARCH_UP" ]; then
              echo "❌ Search service does not exist — provision failed critically"
              exit 1
            fi
            echo "✅ Search service '${SEARCH_UP}' is up — continuing despite update error"
          fi

          # Deploy application
          echo "🚀 Deploying application..."
          azd deploy --no-prompt

      - name: Setup Foundry Agent
        run: |
          set -e
          RG="rg-${AZURE_ENV_NAME}"
          BACKEND_APP="ca-backend-${AZURE_ENV_NAME}"
          FOUNDRY_NAME="foundry-${AZURE_ENV_NAME}"
          
          # Ensure the CI/CD service principal has Azure AI Developer on the Foundry account.
          # Must use AZURE_PRINCIPAL_ID (object ID), not AZURE_CLIENT_ID (app ID).
          # "Azure AI Developer" is required for agent data-plane operations (read/write agents).
          FOUNDRY_ID=$(az cognitiveservices account show \
            --name "$FOUNDRY_NAME" \
            --resource-group "$RG" \
            --query "id" -o tsv)
          az role assignment create \
            --assignee "$AZURE_PRINCIPAL_ID" \
            --role "Azure AI Developer" \
            --scope "$FOUNDRY_ID" \
            --only-show-errors 2>/dev/null || true

          # Wait for RBAC propagation (can take up to 5 minutes)
          echo "⏳ Waiting 90s for RBAC propagation..."
          sleep 90

          # Install SDKs
          pip install azure-ai-agents azure-ai-projects azure-identity azure-search-documents 2>&1 | tail -3
          
          # Construct endpoint env vars used by setup script
          export AZURE_AI_PROJECT_ENDPOINT="https://${FOUNDRY_NAME}.services.ai.azure.com/api/projects/project-${AZURE_ENV_NAME}"
          export AZURE_SEARCH_ENDPOINT="https://search-${AZURE_ENV_NAME}.search.windows.net"
          export AZURE_SEARCH_INDEX_NAME="documents"
          export AZURE_OPENAI_CHAT_DEPLOYMENT="gpt-4o-mini"
          export AZURE_OPENAI_ENDPOINT=$(az cognitiveservices account show \
            --name "$FOUNDRY_NAME" \
            --resource-group "$RG" \
            --query "properties.endpoint" -o tsv)
          
          echo "📡 Foundry: $AZURE_AI_PROJECT_ENDPOINT"
          # Note: AI Search index creation is skipped here because AI Search has
          # publicNetworkAccess=disabled (private endpoint only). The backend creates
          # the index on first startup from inside the VNet.
          
          # Run agent setup with retries for RBAC propagation
          for attempt in 1 2 3; do
            echo "🔄 Agent setup attempt $attempt/3..."
            if python scripts/setup-agent.py; then
              echo "✅ Agent setup succeeded"
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "⏳ Retrying in 60s..."
              sleep 60
            else
              echo "⚠️ Agent setup failed after 3 attempts — may need manual connection setup in Foundry portal"
            fi
          done
          
          # If agent was created, set the AGENT_ID on the backend
          if [ -f src/backend/.agent-config.json ]; then
            AGENT_ID=$(python3 -c "import json; print(json.load(open('src/backend/.agent-config.json'))['agent_id'])")
            echo "Setting AGENT_ID=$AGENT_ID on backend"
            az containerapp update \
              --name "$BACKEND_APP" \
              --resource-group "$RG" \
              --set-env-vars "AGENT_ID=$AGENT_ID"
            echo "✅ Agent configured on backend"
          fi

      - name: Seed sample documents
        run: |
          set -e
          RG="rg-${AZURE_ENV_NAME}"
          BACKEND_FQDN=$(az containerapp show \
            --name "ca-backend-${AZURE_ENV_NAME}" \
            --resource-group "$RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          BACKEND_URL="https://${BACKEND_FQDN}"

          echo "⏳ Waiting for backend to be healthy at $BACKEND_URL ..."
          for i in $(seq 1 24); do
            if curl -sf "${BACKEND_URL}/health" > /dev/null 2>&1; then
              echo "✅ Backend is healthy"
              break
            fi
            echo "  Attempt $i/24 — not ready yet, waiting 15s..."
            sleep 15
          done

          echo "🌱 Seeding sample documents from docs/samples/ ..."
          bash scripts/seed-documents.sh "$BACKEND_URL"

      - name: Print deployment URLs
        run: |
          RG="rg-${AZURE_ENV_NAME}"
          FRONTEND_FQDN=$(az containerapp show --name "ca-frontend-${AZURE_ENV_NAME}" --resource-group "$RG" --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "unknown")
          BACKEND_FQDN=$(az containerapp show --name "ca-backend-${AZURE_ENV_NAME}" --resource-group "$RG" --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "unknown")
          echo ""
          echo "========================================="
          echo "  🌐 Frontend: https://${FRONTEND_FQDN}"
          echo "  📡 Backend:  https://${BACKEND_FQDN}"
          echo "========================================="
